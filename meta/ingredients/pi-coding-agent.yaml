- defaults:
    link:
      relink: true
      create: true
      force: true
    shell:
      quiet: false
      stderr: true

- clean: []

- shell:
    - description: "Ensure the private agent configuration repository exists"
      command: |
        REPO_DIR="$HOME/repos/claude-config"
        REPO_URL="git@github.com:kahl-dev/claude-config.git"

        if [ ! -d "$REPO_DIR/.git" ]; then
          if ! git clone "$REPO_URL" "$REPO_DIR"; then
            echo "ERROR: Failed to clone $REPO_URL" >&2
            echo "Ensure the GitHub SSH key has access to the private repository." >&2
            exit 1
          fi
        fi

- create:
    - ~/.pi/agent
    - ~/.pi-lens

- link:
    ~/.pi/agent/CLAUDE.md: ~/repos/claude-config/pi/GLOBAL.CLAUDE.md
    ~/.pi/agent/settings.json: ~/repos/claude-config/pi/settings.json
    ~/.pi-lens/config.json: ~/repos/claude-config/pi/pi-lens/config.json

- shell:
    - description: "Install the official Herdr integration for Pi"
      command: |
        if command -v herdr >/dev/null 2>&1; then
          herdr integration install pi
        else
          echo "herdr: not installed - skipping Pi integration."
        fi
