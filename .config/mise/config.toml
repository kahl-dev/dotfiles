[settings]
legacy_version_file = true

[tools]
# 📦 Package managers
"npm:yarn" = "latest"
"npm:pnpm" = "latest"
"npm:@antfu/ni" = "latest"

# 🛠️ Dev tools
"npm:vercel" = "latest"
"npm:prettier" = "latest"
"npm:diff-so-fancy" = "latest"
"npm:hunkdiff" = "latest"        # hunk — review-first terminal diff viewer (hunk.dev)
"npm:serve" = "latest"
"npm:browser-sync" = "latest"
"npm:neovim" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"  # pi — minimal AI coding agent harness (pi.dev)

# 🧠 Claude Code LSP servers
"npm:typescript-language-server" = "latest"
"npm:typescript" = "latest"
"npm:intelephense" = "latest"
"npm:pyright" = "latest"

# 🏗️ Runtimes & compilers
node = "lts"
go = "latest"
bun = "latest"
rust = "latest"
uv = "latest"

# 🐚 Shell tooling
atuin = "latest"                 # shell history — replaces the curl installer in ~/.atuin/bin
fzf = "latest"                   # replaces fzf_build and stale system packages — the zsh config
                                 # needs >=0.48 (fzf --zsh); fzf-tmux is vendored in bin/ (mise
                                 # ships only the binary)
herdr = "latest"                 # agent-aware multiplexer — pin a version once it graduates
                                 # from trial: v0.x, and mise.yaml installs unattended everywhere

# 🔍 Linters & formatters
shellcheck = "latest"
stylua = "latest"
shfmt = "latest"
"pipx:yamllint" = "latest"
"npm:playwright" = "latest"

# 🌐 Browser automation
"npm:@playwright/cli" = "latest"
